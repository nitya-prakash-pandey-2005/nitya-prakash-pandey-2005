<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="GitHub overview">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0C1630"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  .h { font-size: 17px; font-weight: 650; fill: #E8EEF9; }
  .stamp { font-size: 11.5px; fill: #4A5A7E; }
  .lbl { font-size: 13px; fill: #8A97B4; }
  .val { font-size: 21px; font-weight: 700; fill: #E8EEF9; font-variant-numeric: tabular-nums; }
  .small { font-size: 11.5px; fill: #4A5A7E; font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; fill: #B9C5DD; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) .2s both; } @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="330" rx="16" fill="url(#bg)"/>
<rect width="900" height="330" rx="16" fill="url(#grid)"/>
<rect x=".5" y=".5" width="899" height="329" rx="15.5" fill="none" stroke="#1C2A48"/>
<text x="28" y="40" class="h">GitHub overview</text>
<text x="872" y="40" class="stamp" text-anchor="end">refreshed 28 Sep 2026</text>
<g transform="translate(28,78)">
