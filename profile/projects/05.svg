<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-label="travelmind: AI copilot for travel agencies and corporate travel: quotes from live supplier inventory, AI answers with every price checked against live offers, fare intelligence, travel policy and approvals, GST invoicing and CO₂ reports. Sci-fi mission-control UI.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#181F40"/></linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA" stop-opacity=".3"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="sfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".3"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="440" height="176" rx="14"/></clipPath>
  <clipPath id="cc"><rect x="190.4" y="143.1" width="110" height="14.4"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  .tag { font: 600 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #A78BFA; }
  .st { font: 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; fill: #8A97B4; }
  .nm { font-size: 19px; font-weight: 700; fill: #E8EEF9; letter-spacing: -.2px; }
  .ds { font-size: 12.5px; fill: #B9C5DD; }
  .m { font: 11.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #B9C5DD; }
  .sweep { animation: sweep 5s cubic-bezier(.5,0,.5,1) 2.4s infinite; }
  @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(480px); } }
  .led { animation: led 1.8s ease-in-out infinite; } @keyframes led { 50% { opacity: .25; } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
  @keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  .draw { stroke-dasharray: 163; animation: draw 2.2s cubic-bezier(.5,0,.2,1) .3s both; }
  @keyframes draw { from { stroke-dashoffset: 163; } }
  .in { animation: in .8s cubic-bezier(.2,.8,.2,1) both; } @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
  .fade { animation: fade 1s ease 1.8s both; } @keyframes fade { from { opacity: 0; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .cup { animation: cup 1.8s cubic-bezier(.3,.7,.2,1) both; } @keyframes cup { from { transform: translateY(var(--h)); } }
  .run { stroke-dasharray: 9 41; animation: run 7s linear infinite; } @keyframes run { from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }
  .star { opacity: .12; animation: star 4s ease-in-out infinite; } @keyframes star { 50% { opacity: .7; } }
  .comet { stroke-dasharray: 10 193; opacity: 0; animation: comet 3.2s linear 2.6s infinite both; }
  @keyframes comet { 0% { stroke-dashoffset: 10; opacity: 1; } 100% { stroke-dashoffset: -163; opacity: 1; } }
  .eping { transform-box: fill-box; transform-origin: center; opacity: 0; animation: eping 2.2s ease-out 2.6s infinite; }
  @keyframes eping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
  .lping { transform-box: fill-box; transform-origin: center; opacity: 0; animation: eping 2.6s ease-out 1.5s infinite; }
  .glitch { animation: in .8s cubic-bezier(.2,.8,.2,1) .15s both, glitch 8s steps(1, end) 5.6s infinite; }
  @keyframes glitch { 0%, 95%, 100% { opacity: 1; transform: none; } 96% { opacity: .35; transform: translateX(3px); } 97% { opacity: 1; transform: translateX(-2px); } 98% { opacity: .6; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { display: none; } }
</style>
