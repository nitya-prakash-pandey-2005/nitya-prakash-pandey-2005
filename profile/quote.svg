<svg xmlns="http://www.w3.org/2000/svg" width="900" height="204" viewBox="0 0 900 204" role="img" aria-label="Quote of the day: Make it work, make it right, make it fast. — Kent Beck">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0C1630"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A3E635" stop-opacity=".8"/><stop offset=".45" stop-color="#A3E635" stop-opacity=".15"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
  <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3E635" stop-opacity="0"/><stop offset="1" stop-color="#A3E635" stop-opacity=".09"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="900" height="204" rx="16"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  .t { font: 600 13px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 2.6px; fill: #E8EEF9; }
  .code { fill: #A3E635; }
  .stamp { font: 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #8A97B4; }
  .lbl { font: 11px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.4px; fill: #8A97B4; }
  .val { font-size: 24px; font-weight: 700; fill: #E8EEF9; font-variant-numeric: tabular-nums; }
  .small { font: 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #8A97B4; }
  .note { font-size: 13px; fill: #B9C5DD; }
  .strong { fill: #E8EEF9; font-weight: 650; }
  .scan { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(204px); } }
  .blink { animation: blink 1.6s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .15; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 90s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } }
  .cup { animation: cup 1.8s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes cup { from { transform: translateY(var(--h)); } }
  .cmd { font: 13px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #B9C5DD; } .qt { font-size: 19px; font-weight: 600; fill: #E8EEF9; font-style: italic; } .au { font: 700 13px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #A3E635; letter-spacing: 1px; } .type { animation: type 1.1s cubic-bezier(.3,0,.2,1) both; } @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } } .cur { animation: blink 1s steps(2, start) infinite; } .crt { animation: crt 3.5s linear infinite; } @keyframes crt { from { transform: translateY(0); } to { transform: translateY(84px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } }
</style>
<g clip-path="url(#card)">
  <rect width="900" height="204" fill="url(#bg)"/>
  <rect width="900" height="204" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="900" height="80" fill="url(#scanline)"/>
</g>
<rect x=".5" y=".5" width="899" height="203" rx="15.5" fill="none" stroke="#1C2A48"/>
<g fill="none" stroke="#A3E635" stroke-opacity=".8" stroke-width="1.5"><path d="M10,26 L10,10 L26,10"/><path d="M890,26 L890,10 L874,10"/><path d="M10,178 L10,194 L26,194"/><path d="M890,178 L890,194 L874,194"/></g>
<circle cx="31" cy="34" r="3.5" fill="#A3E635" class="blink"/>
<text x="44" y="38.5" class="t"><tspan class="code">10 //</tspan> TRANSMISSION OF THE DAY</text>
<text x="872" y="38.5" class="stamp" text-anchor="end">SYNC 10 OCT 2026 · IST</text>
<rect x="28" y="52" width="844" height="1" fill="url(#rule)"/>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#FFFFFF" fill-opacity=".035"/></pattern><linearGradient id="crt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3E635" stop-opacity="0"/><stop offset="1" stop-color="#A3E635" stop-opacity=".1"/></linearGradient></defs>
<rect x="28" y="66" width="844" height="116" rx="10" fill="#060B18" stroke="#1C2A48"/>
<rect x="28" y="66" width="844" height="22" rx="10" fill="#0E1730"/><rect x="28" y="78" width="844" height="10" fill="#0E1730"/>
<circle cx="46" cy="77" r="4.5" fill="#FB7185"/>
<circle cx="62" cy="77" r="4.5" fill="#FBBF24"/>
<circle cx="78" cy="77" r="4.5" fill="#A3E635"/>
<text x="450.0" y="81" class="small" text-anchor="middle">transmission://quote-of-the-day · 10 Oct 2026</text>
<g class="type" style="animation-delay:.3s"><text x="46" y="110" class="cmd"><tspan style="fill:#A3E635">$</tspan> fortune --sci-fi --daily</text></g>
<g class="type" style="animation-delay:1.0s"><text x="46" y="136" class="qt">“Make it work, make it right, make it fast.”</text></g>
<g class="type" style="animation-delay:1.9s"><text x="854" y="136" class="au" text-anchor="end">— Kent Beck</text></g>
<rect x="856" y="123" width="8" height="16" fill="#A3E635" class="cur"/>
<rect x="28" y="88" width="844" height="94" fill="url(#scan)" pointer-events="none"/>
<rect x="28" y="88" width="844" height="30" fill="url(#crt)" class="crt"/>
</svg>
