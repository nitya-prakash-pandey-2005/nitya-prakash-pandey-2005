<style>
  text { font-family: -apple-system, "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  .t { font: 600 13px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 2.6px; fill: #E8EEF9; }
  .code { fill: #A78BFA; }
  .stamp { font: 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #8A97B4; }
  .lbl { font: 11px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; letter-spacing: 1.4px; fill: #8A97B4; }
  .val { font-size: 24px; font-weight: 700; fill: #E8EEF9; font-variant-numeric: tabular-nums; }
  .small { font: 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #8A97B4; }
  .note { font-size: 13px; fill: #B9C5DD; }
  .strong { fill: #E8EEF9; font-weight: 650; }
  .scan { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(310px); } }
  .blink { animation: blink 1.6s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .15; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 90s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } }
  .cup { animation: cup 1.8s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes cup { from { transform: translateY(var(--h)); } }
  .line { stroke-dasharray: 843; animation: draw 2.4s cubic-bezier(.5,0,.2,1) .2s both; } @keyframes draw { from { stroke-dashoffset: 843; } } .area { animation: fade 1.2s ease 1.4s both; } .pop { animation: fade .5s ease 2.4s both; } .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out 2.6s infinite both; } @keyframes ping { from { transform: scale(.5); opacity: .9; } to { transform: scale(2.4); opacity: 0; } } .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 1s cubic-bezier(.2,.7,.2,1) .6s both; } @keyframes grow { from { transform: scaleY(0); } } .comet { stroke-dasharray: 16 883; animation: comet 4.5s linear 2.6s infinite both; opacity: 0; } @keyframes comet { 0% { stroke-dashoffset: 16; opacity: 1; } 100% { stroke-dashoffset: -843; opacity: 1; } } .vscan { animation: vscan 7s ease-in-out 2.4s infinite both; opacity: 0; } @keyframes vscan { 0% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: .55; } 100% { transform: translateX(523px); opacity: 0; } } .shim { animation: shim 3.2s ease-in-out infinite; } @keyframes shim { 0% { transform: translateY(0); } 60%, 100% { transform: translateY(-170px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } }
</style>
