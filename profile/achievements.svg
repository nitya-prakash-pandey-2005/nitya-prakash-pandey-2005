<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Results: rank 5, Kaya AI IIT Hackathon 2026; rank 9, Kaggle Agri Image Super-Resolution; top 10, TrackShift Innovation Challenge; top 40, IIT Delhi Innov8 Challenge; top 1.5K, Amazon ML Challenge">
<defs>
