  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } }
  .cup { animation: cup 1.8s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes cup { from { transform: translateY(var(--h)); } }
  .repo { font: 12px ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; fill: #E8EEF9; } .pop { animation: fade .6s ease both; } .comet { animation: tcomet 7.0s linear infinite; } @keyframes tcomet { from { transform: translateX(0); } to { transform: translateX(786px); } } .nping { transform-box: fill-box; transform-origin: center; animation: nping 7.0s ease-out infinite; opacity: 0; } @keyframes nping { 0% { transform: scale(1); opacity: 1; } 12% { transform: scale(3.4); opacity: 0; } 100% { opacity: 0; } } .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; } @keyframes ping { from { transform: scale(.5); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } }
</style>
